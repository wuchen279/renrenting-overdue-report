<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>一键修复工具</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
            background: white;
            border-radius: 16px;
            padding: 30px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }
        h1 {
            color: #1e293b;
            margin-bottom: 20px;
            text-align: center;
        }
        .status-box {
            background: #f8fafc;
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 20px;
            border-left: 4px solid #3b82f6;
        }
        .status-box.success {
            border-left-color: #22c55e;
            background: #f0fdf4;
        }
        .status-box.error {
            border-left-color: #ef4444;
            background: #fef2f2;
        }
        .btn {
            width: 100%;
            padding: 16px;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s;
            margin-bottom: 12px;
        }
        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }
        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 24px rgba(102, 126, 234, 0.4);
        }
        .btn-success {
            background: linear-gradient(135deg, #22c55e 0%, #16a34a 100%);
            color: white;
        }
        .btn-success:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 24px rgba(34, 197, 94, 0.4);
        }
        .btn-danger {
            background: linear-gradient(135deg, #ef4444 0%, #dc2626 100%);
            color: white;
        }
        .btn-danger:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 24px rgba(239, 68, 68, 0.4);
        }
        pre {
            background: #1e293b;
            color: #e2e8f0;
            padding: 16px;
            border-radius: 8px;
            overflow-x: auto;
            font-size: 12px;
            line-height: 1.6;
            max-height: 300px;
            overflow-y: auto;
        }
        .log-container {
            max-height: 400px;
            overflow-y: auto;
            margin-top: 15px;
        }
        .log-entry {
            padding: 8px 12px;
            margin: 5px 0;
            border-radius: 6px;
            font-size: 13px;
            font-family: 'Monaco', 'Courier New', monospace;
        }
        .log-entry.info {
            background: #eff6ff;
            color: #1e40af;
            border-left: 3px solid #3b82f6;
        }
        .log-entry.success {
            background: #f0fdf4;
            color: #166534;
            border-left: 3px solid #22c55e;
        }
        .log-entry.error {
            background: #fef2f2;
            color: #991b1b;
            border-left: 3px solid #ef4444;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🔧 一键修复工具</h1>
        
        <div id="currentStatus" class="status-box">
            <h3 style="margin-bottom:10px;">📊 当前状态</h3>
            <div id="statusContent">正在检查...</div>
        </div>
        
        <button class="btn btn-primary" onclick="checkStatus()">
            🔍 检查当前状态
        </button>
        
        <button class="btn btn-success" onclick="forceSync()">
            🚀 强制同步数据到前台
        </button>
        
        <button class="btn btn-success" onclick="verifyData()">
            ✅ 验证数据完整性
        </button>
        
        <button class="btn btn-primary" onclick="openFrontend()">
            📱 打开前台验证
        </button>
        
        <button class="btn btn-danger" onclick="clearAllData()">
            🗑️ 清除所有数据（重新开始）
        </button>
        
        <div class="log-container" id="logContainer"></div>
    </div>

    <script>
        function log(message, type = 'info') {
            const logContainer = document.getElementById('logContainer');
            const entry = document.createElement('div');
            entry.className = `log-entry ${type}`;
            entry.textContent = `[${new Date().toLocaleTimeString()}] ${message}`;
            logContainer.appendChild(entry);
            logContainer.scrollTop = logContainer.scrollHeight;
            
            console.log(`[FixTool ${type.toUpperCase()}] ${message}`);
        }

        function checkStatus() {
            log('开始检查状态...', 'info');
            
            const cache = localStorage.getItem('auditDataCache');
            const timestamp = localStorage.getItem('auditDataTimestamp');
            const rawFile = localStorage.getItem('auditRawFile');
            const syncTime = localStorage.getItem('adminLastSyncTime');
            
            let statusHtml = '';
            
            if (cache) {
                try {
                    const data = JSON.parse(cache);
                    statusHtml += `
                        <div style="color:#166534;font-weight:600;margin-bottom:8px;">✅ 审核数据缓存存在</div>
                        <div style="font-size:13px;color:#374151;">
                            • 大小: ${(cache.length / 1024).toFixed(2)} KB<br>
                            • 时间戳: ${timestamp || '未知'}<br>
                            • 原始记录数: ${data.rawDataCount || 0}<br>
                            • 月度数据: ${data.monthlyData ? data.monthlyData.length : 0} 条<br>
                            • 周度数据: ${data.weeklyData ? data.weeklyData.length : 0} 条<br>
                            • 店铺数: ${data.stores ? data.stores.length : 0}<br>
                            • 审核人员: ${data.auditors ? data.auditors.length : 0}<br>
                        </div>
                    `;
                    log(`✅ 审核数据存在: ${data.rawDataCount} 条记录`, 'success');
                } catch (e) {
                    statusHtml += `<div style="color:#991b1b;">❌ 数据解析失败: ${e.message}</div>`;
                    log(`❌ 数据解析失败: ${e.message}`, 'error');
                }
            } else {
                statusHtml += '<div style="color:#991b1b;">❌ 审核数据缓存不存在</div>';
                log('❌ 审核数据缓存不存在', 'error');
            }
            
            if (rawFile) {
                statusHtml += `<div style="margin-top:8px;color:#166534;">✅ 原始文件已保存 (${(rawFile.length / 1024).toFixed(2)} KB)</div>`;
                log('✅ 原始文件已保存', 'success');
            } else {
                statusHtml += '<div style="margin-top:8px;color:#6b7280;">ℹ️ 原始文件未保存</div>';
            }
            
            if (syncTime) {
                statusHtml += `<div style="margin-top:8px;color:#166534;">✅ 上次同步时间: ${syncTime}</div>`;
            } else {
                statusHtml += '<div style="margin-top:8px;color:#6b7280;">ℹ️ 未同步过</div>';
            }
            
            document.getElementById('statusContent').innerHTML = statusHtml;
            
            // 更新状态框样式
            const statusBox = document.getElementById('currentStatus');
            if (cache && rawFile) {
                statusBox.className = 'status-box success';
            } else {
                statusBox.className = 'status-box error';
            }
        }

        function forceSync() {
            log('开始强制同步...', 'info');
            
            const cache = localStorage.getItem('auditDataCache');
            
            if (!cache) {
                log('❌ 没有数据可同步！请先在后台上传数据', 'error');
                alert('❌ 没有数据可同步！\n\n请先在后台管理系统上传Excel文件。');
                return;
            }
            
            try {
                const data = JSON.parse(cache);
                
                // 更新时间戳
                const newTimestamp = new Date().toISOString();
                localStorage.setItem('auditDataTimestamp', newTimestamp);
                
                // 标记为已同步
                data.syncedAt = newTimestamp;
                data.forceSynced = true;
                localStorage.setItem('auditDataCache', JSON.stringify(data));
                
                // 保存同步元数据
                const syncData = {
                    timestamp: newTimestamp,
                    source: 'fix-tool',
                    action: 'force-sync',
                    hasAuditData: true,
                    rawDataCount: data.rawDataCount,
                    monthlyDataLength: data.monthlyData ? data.monthlyData.length : 0
                };
                localStorage.setItem('adminSyncData', JSON.stringify(syncData));
                localStorage.setItem('adminLastSyncTime', new Date().toLocaleString('zh-CN'));
                
                // 通过 BroadcastChannel 通知所有窗口
                if (typeof BroadcastChannel !== 'undefined') {
                    const channel = new BroadcastChannel('fengkong-admin-channel');
                    channel.postMessage({
                        type: 'data-synced',
                        source: 'admin-fix-tool',
                        timestamp: Date.now(),
                        payload: syncData,
                        forceRefresh: true
                    });
                    
                    log('✅ 已通过 BroadcastChannel 发送通知', 'success');
                }
                
                // 多次发送通知（确保前台收到）
                setTimeout(() => {
                    if (typeof BroadcastChannel !== 'undefined') {
                        const channel = new BroadcastChannel('fengkong-admin-channel');
                        channel.postMessage({
                            type: 'data-synced',
                            source: 'admin-fix-tool-retry',
                            timestamp: Date.now(),
                            forceRefresh: true
                        });
                        log('✅ 已发送第二次通知', 'success');
                    }
                }, 1000);
                
                setTimeout(() => {
                    if (typeof BroadcastChannel !== 'undefined') {
                        const channel = new BroadcastChannel('fengkong-admin-channel');
                        channel.postMessage({
                            type: 'data-synced',
                            source: 'admin-fix-tool-final',
                            timestamp: Date.now(),
                            forceRefresh: true
                        });
                        log('✅ 已发送第三次通知', 'success');
                    }
                }, 2000);
                
                log(`✅ 强制同步完成！${data.rawDataCount} 条记录已就绪`, 'success');
                log('💡 请打开前台页面查看效果', 'info');
                
                alert(`✅ 同步成功！\n\n数据记录: ${data.rawDataCount} 条\n月度数据: ${data.monthlyData ? data.monthlyData.length : 0} 条\n\n请刷新或打开前台页面查看效果。`);
                
                checkStatus();
                
            } catch (e) {
                log(`❌ 同步失败: ${e.message}`, 'error');
                alert(`❌ 同步失败: ${e.message}`);
            }
        }

        function verifyData() {
            log('开始验证数据完整性...', 'info');
            
            const cache = localStorage.getItem('auditDataCache');
            
            if (!cache) {
                log('❌ 没有数据可验证', 'error');
                return;
            }
            
            try {
                const data = JSON.parse(cache);
                let allPassed = true;
                let issues = [];
                
                // 验证基本字段
                if (!data.success) {
                    issues.push('success 字段缺失或为 false');
                    allPassed = false;
                }
                
                if (!data.monthlyData || !Array.isArray(data.monthlyData)) {
                    issues.push('monthlyData 缺失或不是数组');
                    allPassed = false;
                } else if (data.monthlyData.length === 0) {
                    issues.push('monthlyData 为空数组');
                    allPassed = false;
                } else {
                    log(`✅ monthlyData: ${data.monthlyData.length} 条`, 'success');
                    
                    // 验证月度数据格式
                    const sampleMonth = data.monthlyData[0];
                    const requiredFields = ['year', 'month', 'total_orders', 'pass_rate'];
                    requiredFields.forEach(field => {
                        if (!(field in sampleMonth)) {
                            issues.push(`月度数据缺少字段: ${field}`);
                            allPassed = false;
                        }
                    });
                }
                
                if (!data.weeklyData || !Array.isArray(data.weeklyData)) {
                    issues.push('weeklyData 缺失或不是数组');
                    allPassed = false;
                } else {
                    log(`✅ weeklyData: ${data.weeklyData.length} 条`, 'success');
                }
                
                if (!data.stores || !Array.isArray(data.stores)) {
                    issues.push('stores 缺失或不是数组');
                    allPassed = false;
                } else {
                    log(`✅ stores: ${data.stores.length} 条`, 'success');
                }
                
                if (!data.auditors || !Array.isArray(data.auditors)) {
                    issues.push('auditors 缺失或不是数组');
                    allPassed = false;
                } else {
                    log(`✅ auditors: ${data.auditors.length} 条`, 'success');
                }
                
                if (!data.summary) {
                    issues.push('summary 缺失');
                    allPassed = false;
                } else {
                    log(`✅ summary 存在`, 'success');
                }
                
                if (allPassed) {
                    log('✅ 所有验证通过！数据完整且格式正确', 'success');
                    alert('✅ 数据验证通过！\n\n所有必要字段都存在，格式正确。\n可以正常显示在前台。');
                } else {
                    log(`⚠️ 发现 ${issues.length} 个问题:`, 'error');
                    issues.forEach(issue => log(`  ❌ ${issue}`, 'error'));
                    alert(`⚠️ 发现 ${issues.length} 个问题:\n\n${issues.join('\n')}\n\n建议重新上传数据。`);
                }
                
            } catch (e) {
                log(`❌ 数据验证失败: ${e.message}`, 'error');
            }
        }

        function openFrontend() {
            log('正在打开前台...', 'info');
            window.open('audit.html', '_blank');
        }

        function clearAllData() {
            if (confirm('确定要清除所有数据吗？\n\n这将删除:\n• 审核数据缓存\n• 原始文件\n• 同步时间戳')) {
                localStorage.removeItem('auditDataCache');
                localStorage.removeItem('auditDataTimestamp');
                localStorage.removeItem('auditRawFile');
                localStorage.removeItem('adminSyncData');
                localStorage.removeItem('adminLastSyncTime');
                
                log('✅ 所有数据已清除', 'success');
                alert('✅ 所有数据已清除！\n\n请重新在后台上传数据。');
                
                checkStatus();
            }
        }

        // 页面加载时自动检查状态
        window.onload = function() {
            setTimeout(checkStatus, 500);
        };
    </script>
</body>
</html>
