<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>审核数据系统诊断工具</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
  min-height: 100vh;
  padding: 20px;
}
.container {
  max-width: 900px;
  margin: 0 auto;
  background: white;
  border-radius: 16px;
  box-shadow: 0 20px 60px rgba(0,0,0,0.3);
  overflow: hidden;
}
.header {
  background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
  color: white;
  padding: 30px;
  text-align: center;
}
.header h1 { font-size: 28px; margin-bottom: 10px; }
.header p { opacity: 0.9; font-size: 14px; }
.content { padding: 30px; }
.test-section {
  background: #f8f9fa;
  border-radius: 12px;
  padding: 20px;
  margin-bottom: 20px;
  border-left: 4px solid #667eea;
}
.test-section h3 {
  color: #333;
  margin-bottom: 15px;
  font-size: 18px;
  display: flex;
  align-items: center;
  gap: 10px;
}
.test-item {
  background: white;
  padding: 12px 16px;
  border-radius: 8px;
  margin-bottom: 10px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  border: 1px solid #e9ecef;
}
.test-item .label { color: #495057; font-weight: 500; }
.test-item .status { 
  padding: 4px 12px; 
  border-radius: 20px; 
  font-size: 13px; 
  font-weight: 600;
}
.status.pending { background: #fff3cd; color: #856404; }
.status.success { background: #d4edda; color: #155724; }
.status.error { background: #f8d7da; color: #721c24; }
.status.warning { background: #ffeeba; color: #856404; }
.button-group {
  display: flex;
  gap: 12px;
  margin-top: 20px;
  flex-wrap: wrap;
}
.btn {
  padding: 12px 24px;
  border: none;
  border-radius: 8px;
  cursor: pointer;
  font-size: 14px;
  font-weight: 600;
  transition: all 0.3s;
  flex: 1;
  min-width: 150px;
}
.btn-primary {
  background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
  color: white;
}
.btn-primary:hover { transform: translateY(-2px); box-shadow: 0 5px 15px rgba(102,126,234,0.4); }
.btn-secondary {
  background: #6c757d;
  color: white;
}
.btn-success {
  background: #28a745;
  color: white;
}
.log-area {
  background: #212529;
  color: #28a745;
  padding: 15px;
  border-radius: 8px;
  font-family: 'Courier New', monospace;
  font-size: 12px;
  max-height: 300px;
  overflow-y: auto;
  margin-top: 20px;
  line-height: 1.6;
}
.result-card {
  background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
  color: white;
  padding: 25px;
  border-radius: 12px;
  text-align: center;
  margin-top: 20px;
  display: none;
}
.result-card.show { display: block; animation: fadeIn 0.5s; }
.result-card h2 { font-size: 24px; margin-bottom: 10px; }
.result-card p { opacity: 0.9; font-size: 14px; }
@keyframes fadeIn {
  from { opacity: 0; transform: translateY(10px); }
  to { opacity: 1; transform: translateY(0); }
}
</style>
</head>
<body>
<div class="container">
  <div class="header">
    <h1>🔍 审核数据系统诊断工具</h1>
    <p>快速检测 Supabase 连接状态、数据库表结构、API 配置等关键信息</p>
  </div>

  <div class="content">
    <div class="test-section">
      <h3>📡 基础连接测试</h3>
      <div id="basicTests"></div>
    </div>

    <div class="test-section">
      <h3>🗄️ 数据库表结构测试</h3>
      <div id="tableTests"></div>
    </div>

    <div class="test-section">
      <h3>⚙️ API 配置检查</h3>
      <div id="configTests"></div>
    </div>

    <div class="button-group">
      <button class="btn btn-primary" onclick="runAllTests()">🚀 开始全面诊断</button>
      <button class="btn btn-secondary" onclick="clearResults()">🔄 清除结果</button>
      <button class="btn btn-success" onclick="window.open('audit.html', '_blank')">📊 打开审核页面</button>
    </div>

    <div class="log-area" id="logArea">[系统就绪] 等待开始诊断...\n</div>

    <div class="result-card" id="resultCard">
      <h2 id="resultTitle">✅ 系统正常</h2>
      <p id="resultMessage">所有组件工作正常，可以正常使用！</p>
    </div>
  </div>
</div>

<script src="supabase.js"></script>
<script>
var SUPABASE_URL = typeof SUPABASE_URL !== 'undefined' ? SUPABASE_URL : 'https://mufudfalsojocgibetpm.supabase.co';
var SUPABASE_ANON_KEY = typeof SUPABASE_ANON_KEY !== 'undefined' ? SUPABASE_ANON_KEY : 'sb_publishable_cnxW0pvZomoCtrxKRF49Uw_yuQT8B_A';

function log(msg) {
  var logArea = document.getElementById('logArea');
  var time = new Date().toLocaleTimeString('zh-CN');
  logArea.innerHTML += '[' + time + '] ' + msg + '\n';
  logArea.scrollTop = logArea.scrollHeight;
}

function createTestItem(label) {
  return '<div class="test-item">' +
    '<span class="label">' + label + '</span>' +
    '<span class="status pending" id="' + label.replace(/\s+/g, '-') + '">待检测</span>' +
    '</div>';
}

function updateTestStatus(label, status, detail) {
  var elementId = label.replace(/\s+/g, '-');
  var el = document.getElementById(elementId);
  if (el) {
    el.className = 'status ' + status;
    el.textContent = detail || status;
  }
}

async function testNetworkConnection() {
  log('开始网络连接测试...');
  updateTestStatus('Supabase服务器', 'pending', '连接中...');
  
  try {
    var controller = new AbortController();
    var timeoutId = setTimeout(function() { controller.abort(); }, 5000);
    
    var startTime = Date.now();
    var response = await fetch(SUPABASE_URL + '/rest/v1/', {
      method: 'GET',
      headers: {
        'apikey': SUPABASE_ANON_KEY,
        'Authorization': 'Bearer ' + SUPABASE_ANON_KEY
      },
      signal: controller.signal
    });
    
    clearTimeout(timeoutId);
    var latency = Date.now() - startTime;
    
    log('✅ 网络连接成功 (HTTP ' + response.status + ', 延迟:' + latency + 'ms)');
    
    if (response.status === 200 || response.status === 401) {
      updateTestStatus('Supabase服务器', 'success', '✓ 可访问 (' + latency + 'ms)');
      return { success: true, status: response.status, latency: latency };
    } else {
      updateTestStatus('Supabase服务器', 'warning', 'HTTP ' + response.status);
      return { success: true, status: response.status, latency: latency };
    }
    
  } catch (error) {
    clearTimeout(timeoutId);
    
    var errorMsg = error.message;
    if (error.name === 'AbortError') {
      errorMsg = '请求超时（>5秒）';
      updateTestStatus('Supabase服务器', 'error', '超时');
    } else if (error.message.indexOf('Failed to fetch') !== -1) {
      errorMsg = '网络不可达';
      updateTestStatus('Supabase服务器', 'error', '无法连接');
    } else {
      updateTestStatus('Supabase服务器', 'error', '失败');
    }
    
    log('❌ 网络连接失败: ' + errorMsg);
    return { success: false, error: errorMsg };
  }
}

async function testTableExistence(tableName) {
  log('检查表是否存在: ' + tableName + '...');
  updateTestStatus(tableName, 'pending', '查询中...');
  
  try {
    var controller = new AbortController();
    var timeoutId = setTimeout(function() { controller.abort(); }, 8000);
    
    var response = await fetch(SUPABASE_URL + '/rest/v1/' + tableName + '?select=*&limit=1', {
      method: 'GET',
      headers: {
        'apikey': SUPABASE_ANON_KEY,
        'Authorization': 'Bearer ' + SUPABASE_ANON_KEY,
        'Content-Type': 'application/json'
      },
      signal: controller.signal
    });
    
    clearTimeout(timeoutId);
    
    if (response.status === 200) {
      var data = await response.json();
      log('✅ 表 ' + tableName + ' 存在（数据条数: ' + (Array.isArray(data) ? data.length : 'N/A') + '）');
      updateTestStatus(tableName, 'success', '✓ 存在 (' + (Array.isArray(data) ? data.length + '条' : '有数据') + ')');
      return { exists: true, count: Array.isArray(data) ? data.length : 0 };
      
    } else if (response.status === 404) {
      log('⚠️ 表 ' + tableName + ' 不存在（HTTP 404）');
      updateTestStatus(tableName, 'error', '不存在');
      return { exists: false, status: 404 };
      
    } else if (response.status === 401 || response.status === 403) {
      log('⚠️ 认证失败（HTTP ' + response.status + '），可能表存在但无权限读取');
      updateTestStatus(tableName, 'warning', '认证受限');
      return { exists: null, authError: true, status: response.status };
      
    } else {
      log('⚠️ 意外的HTTP状态: ' + response.status);
      updateTestStatus(tableName, 'warning', 'HTTP ' + response.status);
      return { exists: null, status: response.status };
    }
    
  } catch (error) {
    clearTimeout(timeoutId);
    log('❌ 检查表 ' + tableName + ' 失败: ' + error.message);
    updateTestStatus(tableName, 'error', '请求失败');
    return { exists: false, error: error.message };
  }
}

function checkConfig() {
  log('检查API配置...');
  
  var urlValid = SUPABASE_URL && SUPABASE_URL.indexOf('http') === 0 && SUPABASE_URL.indexOf('YOUR_') === -1;
  var keyValid = SUPABASE_ANON_KEY && SUPABASE_ANON_KEY.length > 10 && SUPABASE_ANON_KEY.indexOf('YOUR_') === -1;
  
  updateTestStatus('URL配置', urlValid ? 'success' : 'error', urlValid ? '✓ 已配置' : '✗ 未配置/占位符');
  updateTestStatus('API Key', keyValid ? 'success' : (SUPABASE_ANON_KEY.indexOf('sb_publishable') !== -1 ? 'warning' : 'error'), 
    keyValid ? '✓ 已配置' : (SUPABASE_ANON_KEY.indexOf('sb_publishable') !== -1 ? '⚠ Publishable Key' : '✗ 未配置'));
  
  log('URL: ' + (urlValid ? SUPABASE_URL : '无效'));
  log('Key: ' + (keyValid ? SUPABASE_ANON_KEY.substring(0, 15) + '...' : '无效'));
  
  return { urlValid: urlValid, keyValid: keyValid };
}

async function runAllTests() {
  clearResults();
  log('\n========== 开始全面诊断 ==========\n');
  
  document.getElementById('basicTests').innerHTML = createTestItem('Supabase服务器');
  document.getElementById('tableTests').innerHTML = 
    createTestItem('audit_raw_data') +
    createTestItem('audit_monthly_summary') +
    createTestItem('audit_weekly_summary');
  document.getElementById('configTests').innerHTML =
    createTestItem('URL配置') +
    createTestItem('API Key');
  
  var results = {};
  
  results.network = await testNetworkConnection();
  results.config = checkConfig();
  
  if (results.network.success) {
    results.raw_data = await testTableExistence('audit_raw_data');
    results.monthly = await testTableExistence('audit_monthly_summary');
    results.weekly = await testTableExistence('audit_weekly_summary');
  } else {
    updateTestStatus('audit_raw_data', 'pending', '跳过（网络不通）');
    updateTestStatus('audit_monthly_summary', 'pending', '跳过（网络不通）');
    updateTestStatus('audit_weekly_summary', 'pending', '跳过（网络不通）');
  }
  
  showFinalResult(results);
  log('\n========== 诊断完成 ==========\n');
}

function showFinalResult(results) {
  var resultCard = document.getElementById('resultCard');
  var titleEl = document.getElementById('resultTitle');
  var msgEl = document.getElementById('resultMessage');
  
  var allTablesExist = results.raw_data && results.raw_data.exists &&
                       results.monthly && results.monthly.exists &&
                       results.weekly && results.weekly.exists;
  
  var networkOk = results.network && results.network.success;
  var configOk = results.config.urlValid && results.config.keyValid;
  
  if (networkOk && allTablesExist && configOk) {
    titleEl.textContent = '🎉 系统完全正常！';
    msgEl.innerHTML = '所有组件工作正常：<br>• ✅ 网络连接畅通<br>• ✅ 数据库表已初始化<br>• ✅ API 配置正确<br><br><strong>可以正常使用审核数据功能！</strong>';
    resultCard.style.background = 'linear-gradient(135deg, #28a745 0%, #20c997 100%)';
    
  } else if (networkOk && !allTablesExist) {
    titleEl.textContent = '⚠️ 需要初始化数据库';
    msgEl.innerHTML = '网络连接正常，但数据库表未找到。<br><br>解决方案：<br>1. 在 Supabase SQL Editor 中执行 supabase-init.sql<br>2. 或使用 admin-new.html 上传Excel文件自动建表<br><br>状态：原始数据表=' + (results.raw_data ? (results.raw_data.exists ? '✓' : '✗') : '?') + ' 月度表=' + (results.monthly ? (results.monthly.exists ? '✓' : '✗') : '?') + ' 周度表=' + (results.weekly ? (results.weekly.exists ? '✓' : '✗') : '?');
    resultCard.style.background = 'linear-gradient(135deg, #ffc107 0%, #ff9800 100%)';
    
  } else if (!networkOk) {
    titleEl.textContent = '❌ 网络连接异常';
    msgEl.innerHTML = '无法连接到 Supabase 服务器。<br><br>错误：' + (results.network.error || '未知错误') + '<br><br>请检查：<br>1. 网络连接是否正常<br>2. 防火墙是否阻止了请求<br>3. Supabase 服务是否可用<br>4. URL和API Key是否正确';
    resultCard.style.background = 'linear-gradient(135deg, #dc3545 0%, #c82333 100%)';
    
  } else {
    titleEl.textContent = '⚠️ 部分功能异常';
    msgEl.innerHTML = '系统存在一些问题需要处理...';
    resultCard.style.background = 'linear-gradient(135deg, #ffc107 0%, #ff9800 100%)';
  }
  
  resultCard.classList.add('show');
}

function clearResults() {
  document.getElementById('logArea').innerHTML = '[系统就绪] 等待开始诊断...\n';
  document.getElementById('resultCard').classList.remove('show');
  document.getElementById('basicTests').innerHTML = '';
  document.getElementById('tableTests').innerHTML = '';
  document.getElementById('configTests').innerHTML = '';
}

window.onload = function() {
  log('诊断工具已加载');
  log('Supabase URL: ' + SUPABASE_URL);
  log('API Key: ' + SUPABASE_ANON_KEY.substring(0, 15) + '...');
};
</script>
</body>
</html>
