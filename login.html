<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>用户登录 - 箭头风控智能化分析平台</title>
<link rel="stylesheet" href="common.css">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", Arial, sans-serif;
  background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 20px;
}

.login-container {
  width: 100%;
  max-width: 440px;
  animation: fadeInUp 0.6s ease;
}

@keyframes fadeInUp {
  from {
    opacity: 0;
    transform: translateY(30px);
  }
  to {
    opacity: 1;
    transform: translateY(0);
  }
}

.login-card {
  background: #ffffff;
  border-radius: 24px;
  padding: 40px 36px;
  box-shadow: 0 25px 50px rgba(0, 0, 0, 0.15), 0 10px 20px rgba(102, 126, 234, 0.2);
}

.login-header {
  text-align: center;
  margin-bottom: 32px;
}

.login-logo {
  width: 72px;
  height: 72px;
  background: linear-gradient(135deg, #667eea, #764ba2);
  border-radius: 18px;
  display: flex;
  align-items: center;
  justify-content: center;
  margin: 0 auto 16px;
  font-size: 32px;
  color: white;
  box-shadow: 0 8px 24px rgba(102, 126, 234, 0.3);
}

.login-header h1 {
  font-size: 22px;
  font-weight: 700;
  color: #16213e;
  margin-bottom: 6px;
}

.login-header p {
  font-size: 14px;
  color: #64748b;
}

.form-group {
  margin-bottom: 20px;
}

.form-label {
  display: block;
  font-size: 13px;
  font-weight: 600;
  color: #374151;
  margin-bottom: 8px;
}

.form-input {
  width: 100%;
  padding: 14px 16px;
  border: 2px solid #e5e7eb;
  border-radius: 12px;
  font-size: 14px;
  transition: all 0.3s ease;
  outline: none;
  background: #f9fafb;
}

.form-input:focus {
  border-color: #667eea;
  background: #fff;
  box-shadow: 0 0 0 4px rgba(102, 126, 234, 0.1);
}

.form-input.error {
  border-color: #dc2626;
  background: #fef2f2;
}

.form-input-wrapper {
  position: relative;
}

.form-input-icon {
  position: absolute;
  left: 14px;
  top: 50%;
  transform: translateY(-50%);
  font-size: 16px;
  opacity: 0.5;
}

.form-input.with-icon {
  padding-left: 44px;
}

.password-toggle {
  position: absolute;
  right: 14px;
  top: 50%;
  transform: translateY(-50%);
  background: none;
  border: none;
  cursor: pointer;
  font-size: 16px;
  opacity: 0.5;
  transition: opacity 0.2s;
  padding: 4px;
}

.password-toggle:hover {
  opacity: 0.8;
}

.error-message {
  color: #dc2626;
  font-size: 12px;
  margin-top: 6px;
  display: flex;
  align-items: center;
  gap: 4px;
}

.success-message {
  color: #16a34a;
  font-size: 12px;
  margin-top: 6px;
  display: flex;
  align-items: center;
  gap: 4px;
}

.btn-login {
  width: 100%;
  padding: 15px;
  background: linear-gradient(135deg, #667eea, #764ba2);
  color: white;
  border: none;
  border-radius: 12px;
  font-size: 15px;
  font-weight: 600;
  cursor: pointer;
  transition: all 0.3s ease;
  margin-top: 8px;
  position: relative;
  overflow: hidden;
}

.btn-login:hover:not(:disabled) {
  transform: translateY(-2px);
  box-shadow: 0 8px 24px rgba(102, 126, 234, 0.35);
}

.btn-login:active:not(:disabled) {
  transform: translateY(0);
}

.btn-login:disabled {
  opacity: 0.6;
  cursor: not-allowed;
}

.btn-loading {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
}

.spinner {
  width: 18px;
  height: 18px;
  border: 2px solid rgba(255,255,255,0.3);
  border-top-color: white;
  border-radius: 50%;
  animation: spin 0.8s linear infinite;
}

@keyframes spin {
  to { transform: rotate(360deg); }
}

.divider {
  display: flex;
  align-items: center;
  margin: 28px 0;
  color: #9ca3af;
  font-size: 13px;
}

.divider::before,
.divider::after {
  content: '';
  flex: 1;
  height: 1px;
  background: #e5e7eb;
}

.divider span {
  padding: 0 16px;
}

.btn-secondary {
  width: 100%;
  padding: 13px;
  background: #f3f4f6;
  color: #374151;
  border: 2px solid #e5e7eb;
  border-radius: 12px;
  font-size: 14px;
  font-weight: 500;
  cursor: pointer;
  transition: all 0.3s ease;
  margin-bottom: 10px;
}

.btn-secondary:hover {
  background: #e5e7eb;
  border-color: #d1d5db;
}

.forgot-link {
  text-align: center;
  margin-top: 20px;
}

.forgot-link a {
  color: #667eea;
  text-decoration: none;
  font-size: 13px;
  font-weight: 500;
  transition: color 0.2s;
}

.forgot-link a:hover {
  color: #5568d3;
  text-decoration: underline;
}

.footer-text {
  text-align: center;
  margin-top: 24px;
  font-size: 12px;
  color: #9ca3af;
}

.toast-notification {
  position: fixed;
  top: 20px;
  right: 20px;
  padding: 14px 24px;
  border-radius: 12px;
  font-size: 13px;
  font-weight: 600;
  color: white;
  z-index: 9999;
  box-shadow: 0 8px 24px rgba(0,0,0,0.15);
  animation: slideInRight 0.3s ease;
  max-width: 380px;
}

.toast-success { background: linear-gradient(135deg, #16a34a, #15803d); }
.toast-error { background: linear-gradient(135deg, #dc2626, #b91c1c); }
.toast-info { background: linear-gradient(135deg, #2563eb, #1d4ed8); }

@keyframes slideInRight {
  from { transform: translateX(100%); opacity: 0; }
  to { transform: translateX(0); opacity: 1; }
}

.demo-notice {
  background: #fef3c7;
  border: 1px solid #f59e0b;
  border-radius: 10px;
  padding: 12px 16px;
  margin-bottom: 20px;
  font-size: 12px;
  color: #92400e;
  line-height: 1.6;
}

@media (max-width: 480px) {
  .login-card {
    padding: 32px 24px;
  }
  
  .login-logo {
    width: 60px;
    height: 60px;
    font-size: 28px;
  }
  
  .login-header h1 {
    font-size: 20px;
  }
}
</style>
</head>
<body>

<div class="login-container">
  <div class="login-card">
    
    <div class="login-header">
      <div class="login-logo">🛡️</div>
      <h1>风控数据平台</h1>
      <p>登录以访问数据管理系统</p>
    </div>

    <div id="demoNotice" class="demo-notice" style="display:none;">
      💡 <strong>演示模式：</strong>系统当前使用本地模拟认证。首次使用请先注册账号。
    </div>

    <form id="loginForm" novalidate>
      
      <div class="form-group">
        <label class="form-label" for="email">邮箱地址</label>
        <div class="form-input-wrapper">
          <span class="form-input-icon">📧</span>
          <input 
            type="email" 
            id="email" 
            name="email"
            class="form-input with-icon" 
            placeholder="请输入您的邮箱"
            autocomplete="email"
            required
          >
        </div>
        <div class="error-message" id="emailError"></div>
      </div>

      <div class="form-group">
        <label class="form-label" for="password">密码</label>
        <div class="form-input-wrapper">
          <span class="form-input-icon">🔒</span>
          <input 
            type="password" 
            id="password" 
            name="password"
            class="form-input with-icon" 
            placeholder="请输入您的密码"
            autocomplete="current-password"
            required
          >
          <button type="button" class="password-toggle" onclick="togglePassword()">👁️</button>
        </div>
        <div class="error-message" id="passwordError"></div>
      </div>

      <button type="submit" class="btn-login" id="btnLogin">
        <span class="btn-text">登 录</span>
      </button>

    </form>

    <div class="forgot-link">
      <a href="#" onclick="showForgotPassword(event)">忘记密码？点击重置</a>
    </div>

    <div class="footer-text">
      © 2026 箭头风控智能化分析平台 · 安全认证
    </div>

  </div>
</div>

<script src="auth.js"></script>
<script>
document.addEventListener('DOMContentLoaded', function() {
  
  checkDemoMode();
  checkExistingSession();
  
  var form = document.getElementById('loginForm');
  form.addEventListener('submit', handleLogin);

  var emailInput = document.getElementById('email');
  var passwordInput = document.getElementById('password');

  emailInput.addEventListener('input', function() { clearError('email'); });
  passwordInput.addEventListener('input', function() { clearError('password'); });

  emailInput.addEventListener('keypress', function(e) {
    if (e.key === 'Enter') passwordInput.focus();
  });
});

function checkDemoMode() {
  if (typeof supabase === 'undefined' || !supabase.createClient) {
    document.getElementById('demoNotice').style.display = 'block';
  }
}

async function checkExistingSession() {
  var sess = await SupabaseAuth.getSession();
  if (sess && SupabaseAuth.isAuthenticated()) {
    showToast('欢迎回来！正在跳转...', 'info');
    setTimeout(function() {
      redirectToDashboard();
    }, 800);
  }
}

function handleLogin(e) {
  e.preventDefault();
  
  if (!validateForm()) return;

  var email = document.getElementById('email').value.trim();
  var password = document.getElementById('password').value;

  setLoading(true);

  SupabaseAuth.signInWithEmail(email, password).then(function(result) {
    setLoading(false);

    if (result.success) {
      showToast('✅ 登录成功！欢迎 ' + (result.user.email || '用户'), 'success');
      setTimeout(function() {
        redirectToDashboard();
      }, 1200);
    } else {
      showError('password', result.error || '登录失败，请重试');
      showToast('❌ ' + (result.error || '登录失败'), 'error');
    }
  }).catch(function(error) {
    setLoading(false);
    console.error('[Login] 异常:', error);
    showToast('❌ 系统错误，请稍后重试', 'error');
  });
}

function validateForm() {
  var isValid = true;
  var email = document.getElementById('email').value.trim();
  var password = document.getElementById('password').value;

  clearError('email');
  clearError('password');

  if (!email) {
    showError('email', '请输入邮箱地址');
    isValid = false;
  } else if (!isValidEmail(email)) {
    showError('email', '邮箱格式不正确');
    isValid = false;
  }

  if (!password) {
    showError('password', '请输入密码');
    isValid = false;
  } else if (password.length < 6) {
    showError('password', '密码至少需要6个字符');
    isValid = false;
  }

  return isValid;
}

function isValidEmail(email) {
  var re = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
  return re.test(email);
}

function showError(field, message) {
  var input = document.getElementById(field);
  var errorEl = document.getElementById(field + 'Error');
  
  input.classList.add('error');
  errorEl.innerHTML = '<span>⚠️</span> ' + message;
}

function clearError(field) {
  var input = document.getElementById(field);
  var errorEl = document.getElementById(field + 'Error');
  
  if (input) input.classList.remove('error');
  if (errorEl) errorEl.innerHTML = '';
}

function setLoading(isLoading) {
  var btn = document.getElementById('btnLogin');
  btn.disabled = isLoading;

  if (isLoading) {
    btn.innerHTML = '<span class="btn-loading"><span class="spinner"></span> 登录中...</span>';
  } else {
    btn.innerHTML = '<span class="btn-text">登 录</span>';
  }
}

function togglePassword() {
  var input = document.getElementById('password');
  var btn = event.target.closest('.password-toggle');

  if (input.type === 'password') {
    input.type = 'text';
    btn.textContent = '🙈';
  } else {
    input.type = 'password';
    btn.textContent = '👁️';
  }
}

function showForgotPassword(e) {
  if (e) e.preventDefault();

  showModal(
    '重置密码',
    '<p style="font-size:13px;color:#6b7280;margin-bottom:20px;line-height:1.6;">请输入您注册时使用的邮箱地址，我们将发送密码重置链接到该邮箱。</p>' +
    '<form id="forgotForm">' +
      '<div class="form-group" style="margin-bottom:20px;">' +
        '<input type="email" id="forgotEmail" class="form-input" placeholder="请输入注册邮箱" required>' +
      '</div>' +
      '<button type="submit" class="btn-login" style="margin-top:0;">发送重置邮件</button>' +
    '</form>',
    null,
    true
  );

  setTimeout(function() {
    document.getElementById('forgotForm').addEventListener('submit', handleForgotPassword);
  }, 100);
}

async function handleForgotPassword(e) {
  e.preventDefault();

  var email = document.getElementById('forgotEmail').value.trim();

  if (!isValidEmail(email)) {
    showToast('⚠️ 请输入有效的邮箱地址', 'error');
    return;
  }

  var btn = e.target.querySelector('.btn-login');
  btn.disabled = true;
  btn.innerHTML = '<span class="btn-loading"><span class="spinner"></span> 发送中...</span>';

  var result = await SupabaseAuth.resetPassword(email);

  btn.disabled = false;
  btn.innerHTML = '发送重置邮件';

  if (result.success) {
    closeModal();
    showToast('✅ ' + result.message, 'success');
  } else {
    showToast('❌ ' + (result.error || '发送失败，请重试'), 'error');
  }
}

function redirectToDashboard() {
  // 获取之前保存的重定向地址
  var redirectUrl = sessionStorage.getItem('auth_redirect');
  sessionStorage.removeItem('auth_redirect');
  
  // 如果没有保存的地址，或者地址无效，使用默认页面
  if (!redirectUrl || redirectUrl === '/' || redirectUrl === '/index.html') {
    // 优先跳转到后台管理系统
    redirectUrl = 'admin-new.html';
  }
  
  console.log('[Login] 跳转到:', redirectUrl);
  window.location.href = redirectUrl;
}

function showToast(message, type) {
  removeToast();

  var toast = document.createElement('div');
  toast.className = 'toast-notification toast-' + (type || 'info');
  toast.id = 'toastNotification';
  toast.textContent = message;
  document.body.appendChild(toast);

  setTimeout(removeToast, 4000);
}

function removeToast() {
  var existing = document.getElementById('toastNotification');
  if (existing) {
    existing.style.opacity = '0';
    existing.style.transition = 'opacity 0.3s';
    setTimeout(function() { if (existing.parentNode) existing.remove(); }, 300);
  }
}

function showModal(title, content, onConfirm, isLarge) {
  removeModal();

  var overlay = document.createElement('div');
  overlay.id = 'modalOverlay';
  overlay.style.cssText = 'position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.5);z-index:10000;display:flex;align-items:center;justify-content:center;padding:20px;animation:fadeIn 0.2s;';

  var modal = document.createElement('div');
  modal.id = 'modalContent';
  modal.style.cssText = 'background:#fff;border-radius:20px;padding:' + (isLarge ? '32px' : '24px') + ';max-width:' + (isLarge ? '480px' : '420px') + ';width:100%;max-height:90vh;overflow-y:auto;box-shadow:0 25px 60px rgba(0,0,0,0.2);animation:slideInUp 0.3s;';

  modal.innerHTML =
    '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:20px;">' +
      '<h2 style="font-size:18px;font-weight:700;color:#16213e;">' + title + '</h2>' +
      '<button onclick="closeModal()" style="background:none;border:none;font-size:20px;cursor:pointer;color:#9ca3af;padding:4px;">✕</button>' +
    '</div>' +
    content;

  overlay.appendChild(modal);
  document.body.appendChild(overlay);

  overlay.addEventListener('click', function(e) {
    if (e.target === overlay) closeModal();
  });

  document.addEventListener('keydown', handleEscKey);
}

function removeModal() {
  var existing = document.getElementById('modalOverlay');
  if (existing) {
    existing.remove();
    document.removeEventListener('keydown', handleEscKey);
  }
}

function closeModal() {
  removeModal();
}

function handleEscKey(e) {
  if (e.key === 'Escape') closeModal();
}

var fadeInStyle = document.createElement('style');
fadeInStyle.textContent = '@keyframes fadeIn{from{opacity:0}to{opacity:1}} @keyframes slideInUp{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}';
document.head.appendChild(fadeInStyle);
</script>

</body>
</html>
